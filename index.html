<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trial Entry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#028090">
<style>
  :root { --fg:#1d2327; --muted:#5f6b72; --bg:#f6f7f8; --card:#fff; --line:#d8dde0; --brand:#028090; --bad:#c00000; --ok:#2e7d32; --warn:#b26a00; --pend:#fff4d6; }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--fg); background:var(--bg); }
  header { position:sticky; top:0; background:var(--brand); color:#fff; padding:8px 12px; display:flex; gap:6px; align-items:center; z-index:2; }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:12px; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.22); white-space:nowrap; }
  .pill.off { background:var(--bad); }
  nav { display:flex; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:40px; z-index:1; }
  nav button { flex:1 0 auto; background:none; color:var(--muted); border:0; border-bottom:3px solid transparent; padding:8px 10px; margin:0; width:auto; font-size:13px; font-weight:600; border-radius:0; }
  nav button.on { color:var(--brand); border-bottom-color:var(--brand); }
  nav button small { display:block; font-weight:400; font-size:11px; }
  main { padding:10px 12px 60px; max-width:720px; margin:0 auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  h2 { font-size:15px; margin:0 0 8px; } h2 small, label small, th small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 2px; }
  input, select, button, textarea { font:inherit; width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--fg); }
  input.pend { background:var(--pend); }
  input:focus, select:focus { outline:2px solid #9ad1d8; }
  button { background:var(--brand); color:#fff; border:0; font-weight:600; margin-top:10px; cursor:pointer; }
  button.secondary { background:#e9eef0; color:var(--fg); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .msg { font-size:13px; margin-top:8px; min-height:1.2em; word-break:break-word; }
  .msg.bad { color:var(--bad); } .msg.ok { color:var(--ok); } .msg.warn { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { border-bottom:1px solid var(--line); padding:5px 4px; text-align:left; vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  td input { padding:7px; } td.n { width:92px; } td.c { width:44px; text-align:center; } td input[type=checkbox] { width:22px; height:22px; }
  .sub { font-size:12px; color:var(--muted); }
  details summary { cursor:pointer; font-weight:600; font-size:15px; }
  .kv { font-size:12px; color:var(--muted); white-space:pre-wrap; }
  .banner { background:#fff4d6; border:1px solid #e0b400; padding:8px 10px; border-radius:8px; margin-bottom:10px; font-size:14px; }
  .banner button { margin-top:6px; }
  .hide { display:none; }
  .tagrow { display:grid; grid-template-columns:1.3fr 1fr auto; gap:6px; align-items:end; } .tagrow button { width:auto; margin:0; padding:9px 14px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Trial Entry</h1>
  <span id="net" class="pill">…</span>
  <span id="queue" class="pill">queue 0</span>
</header>
<nav id="nav"></nav>
<main>
  <div id="update" class="banner hide">New version available. <small>Có bản mới.</small><button id="doUpdate">Update now / Cập nhật</button></div>
  <div id="flash" class="msg"></div>
  <div id="rosterInfo" class="sub"></div>
  <div id="screen"></div>
</main>
<script src="outbox.js"></script>
<script src="app.js"></script>
</body>
</html>
