<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial Entry (Spike A)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#028090">
<style>
  :root { --fg:#1d2327; --muted:#5f6b72; --bg:#f6f7f8; --card:#fff; --line:#d8dde0; --brand:#028090; --bad:#c00000; --ok:#2e7d32; --warn:#b26a00; }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--fg); background:var(--bg); }
  header { position:sticky; top:0; background:var(--brand); color:#fff; padding:10px 16px; display:flex; gap:8px; align-items:center; z-index:1; }
  header h1 { font-size:17px; margin:0; flex:1; }
  .pill { font-size:12px; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.2); white-space:nowrap; }
  .pill.off { background:var(--bad); }
  main { padding:12px 16px 40px; max-width:640px; margin:0 auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  h2 { font-size:15px; margin:0 0 8px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 2px; }
  input, select, button { font:inherit; width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--fg); }
  button { background:var(--brand); color:#fff; border:0; font-weight:600; margin-top:10px; cursor:pointer; }
  button.secondary { background:#e9eef0; color:var(--fg); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .msg { font-size:13px; margin-top:8px; min-height:1.2em; word-break:break-word; }
  .msg.bad { color:var(--bad); } .msg.ok { color:var(--ok); } .msg.warn { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { border-bottom:1px solid var(--line); padding:4px; text-align:left; }
  details summary { cursor:pointer; font-weight:600; font-size:15px; }
  .kv { font-size:12px; color:var(--muted); white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Trial Entry · Spike A</h1>
  <span id="net" class="pill">…</span>
  <span id="queue" class="pill">queue 0</span>
</header>
<main>
  <section>
    <h2>Record (D_Sow_Daily)</h2>
    <div class="row">
      <div><label for="sow">Sow ID</label><input id="sow" list="sows" value="S001" autocomplete="off"></div>
      <div><label for="day">Day</label><input id="day" type="number" inputmode="numeric" value="1" min="0" max="28"></div>
    </div>
    <label for="field">Field</label>
    <select id="field">
      <option value="feed_0700">Feed 07:00 (kg)</option>
      <option value="feed_1000">Feed 10:00 (kg)</option>
      <option value="feed_1400">Feed 14:00 (kg)</option>
      <option value="feed_1630">Feed 16:30 (kg)</option>
      <option value="feed_2100">Feed 21:00 (kg)</option>
      <option value="sow_health">Sow health</option>
      <option value="note">Note</option>
    </select>
    <label for="value">Value <span id="hint">(blank = not recorded, 0 = recorded zero)</span></label>
    <input id="value" inputmode="decimal" autocomplete="off">
    <button id="save">Save</button>
    <div id="saveMsg" class="msg"></div>
    <datalist id="sows"><option value="S001"><option value="S002"></datalist>
  </section>

  <section>
    <h2>Sync</h2>
    <button id="syncNow" class="secondary">Sync now</button>
    <div id="syncMsg" class="msg"></div>
    <div id="caps" class="kv"></div>
  </section>

  <section>
    <details id="queueBox"><summary>Waiting to send (<span id="qn">0</span>)</summary><table id="qt"></table></details>
  </section>
  <section>
    <details><summary>Rejected by server (<span id="rn">0</span>)</summary><table id="rt"></table>
      <button id="clearRej" class="secondary">Clear rejected list</button></details>
  </section>

  <section>
    <details id="setBox"><summary>Settings</summary>
      <label for="endpoint">Endpoint URL (Apps Script /exec)</label><input id="endpoint" autocomplete="off" spellcheck="false">
      <label for="code">Access code</label><input id="code" autocomplete="off" spellcheck="false">
      <label for="device">Device name</label><input id="device" autocomplete="off">
      <button id="saveSet">Save settings</button>
      <button id="test" class="secondary">Test connection</button>
      <div id="setMsg" class="msg"></div>
    </details>
  </section>
</main>
<script src="outbox.js"></script>
<script src="app.js"></script>
</body>
</html>
